{% extends 'base.html' %}
{% block content %}
<h1 class="h4 mb-3">Nowy użytkownik</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body row g-3">
  <div class="col-12 col-md-6"><label class="form-label">Login</label><input class="form-control" name="username" required></div>
  <div class="col-12 col-md-6"><label class="form-label">Rola</label><select class="form-select" name="role">{% for role in roles %}<option>{{ role }}</option>{% endfor %}</select></div>
  <div class="col-12 col-md-6"><label class="form-label">Hasło</label><input class="form-control" type="password" name="password" required></div>
  <div class="col-12"><button class="btn btn-primary">Zapisz</button></div>
</div></form>
{% endblock %}
