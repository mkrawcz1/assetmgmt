{% if items.pages > 1 %}
<nav class="mt-3"><ul class="pagination">
  {% for p in items.iter_pages(left_edge=1, left_current=1, right_current=2, right_edge=1) %}
    {% if p %}
    <li class="page-item {% if p == items.page %}active{% endif %}"><a class="page-link" href="{{ request.path }}?{{ request.query_string.decode().replace('page=' ~ items.page|string, '').strip('&') }}{% if request.query_string %}&{% endif %}page={{ p }}">{{ p }}</a></li>
    {% else %}
    <li class="page-item disabled"><span class="page-link">…</span></li>
    {% endif %}
  {% endfor %}
</ul></nav>
{% endif %}
